# Defaults for `sam build` / `sam deploy`. Parameters you must supply on the
# first deploy (AllowedOrigin, AlertEmail) are asked for by `sam deploy --guided`
# and saved here afterwards.
version = 0.1

[default.global.parameters]
stack_name = "a11y-checker"

[default.build.parameters]
cached = true
# Needed with Docker Desktop's containerd image store (the default now).
use_buildkit = true

[default.deploy.parameters]
region = "ap-south-1"
capabilities = "CAPABILITY_IAM"
resolve_image_repos = true
resolve_s3 = true
# TurnstileSecret is left out on purpose: pass it once with
#   sam deploy --parameter-overrides TurnstileSecret=...
# (CloudFormation keeps the previous value on later deploys).
parameter_overrides = "AllowedOrigin=\"https://accessibility-checker-pi.vercel.app\" AlertEmail=\"viraldeshle1234@gmail.com\" MonthlyBudgetUsd=\"5\" ReservedConcurrency=\"none\" ScansPerIpPerHour=\"5\" ScansPerIpPerDay=\"20\" ScansPerDayGlobal=\"100\""
confirm_changeset = false
fail_on_empty_changeset = false
